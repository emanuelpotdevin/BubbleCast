name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the app to a release

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: sw_vers && swift --version

      - name: Build (Apple silicon + Intel)
        run: UNIVERSAL=1 ./build.sh

      - name: Check the app
        run: |
          lipo -info build/BubbleCast.app/Contents/MacOS/BubbleCast
          codesign --verify --verbose build/BubbleCast.app

      - name: Zip
        run: ditto -c -k --keepParent build/BubbleCast.app build/BubbleCast-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BubbleCast-macOS
          path: build/BubbleCast-macOS.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/BubbleCast-macOS.zip
          generate_release_notes: true
